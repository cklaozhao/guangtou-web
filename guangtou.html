<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光头obsidian教程</title>
  <style>
    :root {
      --ink: #ffffff;
      --muted: rgba(255, 255, 255, 0.58);
      --cream: #f6f3ec;
      --canvas-bg: #111111;
      --line: rgba(255, 255, 255, 0.22);
      --mono: Menlo, Monaco, Consolas, "Courier New", monospace;
      --sans: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: #000;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background: #000;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a {
      color: inherit;
      cursor: pointer;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 86px 24px 96px;
      overflow: hidden;
    }

    .hero-bg,
    .glitch-canvas,
    .vignette-outer,
    .vignette-center,
    .hero-overlay,
    .scanline {
      position: absolute;
      inset: 0;
    }

    .hero-bg {
      z-index: -4;
      overflow: hidden;
      background: var(--canvas-bg);
    }

    .glitch-canvas {
      width: 100%;
      height: 100%;
    }

    .vignette-outer {
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 54%, #000 100%);
    }

    .vignette-center {
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(0, 0, 0, 0.78) 0%,
        rgba(0, 0, 0, 0.2) 43%,
        rgba(0, 0, 0, 0) 64%
      );
    }

    .hero-overlay {
      z-index: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.48);
    }

    .scanline {
      z-index: 1;
      pointer-events: none;
      opacity: 0.08;
      background-image: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.18) 0,
        rgba(255, 255, 255, 0) 1px
      );
      background-size: 100% 4px;
    }

    .content-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(760px, 100%);
      text-align: center;
    }

    .logo-container {
      width: clamp(176px, 23vw, 232px);
      height: clamp(176px, 23vw, 232px);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 900px;
      animation: fade-in-up 0.7s ease-out both;
    }

    .logo-link {
      display: block;
      width: clamp(150px, 18vw, 190px);
      height: clamp(150px, 18vw, 190px);
      border-radius: 50%;
      cursor: pointer;
      text-decoration: none;
      outline-offset: 8px;
    }

    .logo::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      background-image: url("https://photograph-1307041810.cos.ap-nanjing.myqcloud.com/202509041415597.jpg");
      background-position: center;
      background-size: cover;
      -webkit-mask-image: radial-gradient(
        circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
        transparent 0,
        transparent 100%,
        #000 100%
      );
      mask-image: radial-gradient(
        circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
        transparent 0,
        transparent 100%,
        #000 100%
      );
    }

    .logo.is-inverted::after {
      -webkit-mask-image: radial-gradient(
        circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
        #000 0,
        #000 100%,
        transparent 100%
      );
      mask-image: radial-gradient(
        circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
        #000 0,
        #000 100%,
        transparent 100%
      );
    }

    .logo-link:hover .logo,
    .logo-link:focus-visible .logo {
      border-color: #fff;
      box-shadow: 0 26px 72px rgba(0, 0, 0, 0.72);
    }

    .title {
      position: relative;
      min-height: 58px;
      max-width: 100%;
      margin: 28px 0 0;
      padding: 0 8px;
      font-size: clamp(30px, 6vw, 56px);
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: 0;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      background: linear-gradient(90deg, #8d9ead, #c3d0da 44%, #ffffff 92%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fade-in-up 0.7s ease-out 0.16s both;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .title::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 4px;
      height: 1.5px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.85) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .title:hover,
    .title:focus-visible {
      filter: brightness(1.12);
      transform: translateY(-2px);
      outline: none;
    }

    .title:hover::after,
    .title:focus-visible::after {
      transform: scaleX(1);
    }

    .typed-cursor {
      display: inline-block;
      -webkit-text-fill-color: #fff;
      animation: cursor-blink 1s ease-in-out infinite;
    }

    .subtitle {
      margin: 16px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 3.2px;
      text-transform: uppercase;
      animation: fade-in-up 0.7s ease-out 0.28s both;
    }

    .cursor-ring {
      --avatar-x: -1000px;
      --avatar-y: -1000px;
      --avatar-r: 100px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      width: 200px;
      height: 200px;
      pointer-events: none;
      background: var(--cream);
      border-radius: 50%;
      mix-blend-mode: difference;
      opacity: 0;
      transform: translate(-50%, -50%);
      -webkit-mask-image: radial-gradient(
        circle var(--avatar-r) at var(--avatar-x) var(--avatar-y),
        transparent 0,
        transparent 100%,
        #000 100%
      );
      mask-image: radial-gradient(
        circle var(--avatar-r) at var(--avatar-x) var(--avatar-y),
        transparent 0,
        transparent 100%,
        #000 100%
      );
      transition:
        width 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.2s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.15s ease;
    }

    .cursor-ring.is-hidden {
      width: 16px;
      height: 16px;
      -webkit-mask-image: none;
      mask-image: none;
    }

    .cursor-ring.is-on-logo {
      width: 40px;
      height: 40px;
      -webkit-mask-image: none;
      mask-image: none;
    }

    .footer {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 6;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(to top, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0));
      backdrop-filter: blur(2px);
    }

    .footer a {
      color: rgba(255, 255, 255, 0.66);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .footer a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .footer img {
      width: 12px;
      height: 12px;
      margin: 0 2px;
      vertical-align: middle;
    }

    @keyframes cursor-blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding: 76px 18px 112px;
      }

      .title {
        min-height: 42px;
        font-size: clamp(28px, 9vw, 42px);
      }

      .subtitle {
        font-size: 10px;
        letter-spacing: 2px;
      }

      .cursor-ring {
        display: none;
      }

      .footer {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

      <a href="https://beian.mps.gov.cn/#/query/webSearch?code=23000002000108" rel="noreferrer" target="_blank">黑公网安备23000002000108号</a>
    </div>
  </main>

  <script>
    const titleText = "光头obsidian教程";
    const typedTitle = document.getElementById("typedTitle");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function typeTitle() {
      if (reducedMotion) {
        typedTitle.textContent = titleText;
        return;
      }

      let index = 0;
      typedTitle.textContent = "";

      function tick() {
        typedTitle.textContent = titleText.slice(0, index);
        index += 1;

        if (index <= titleText.length) {
          const jitter = Math.random() * 40 - 20;
          window.setTimeout(tick, 78 + jitter);
        }
      }

      window.setTimeout(tick, 340);
    }

    function initGlitchCanvas() {
      const canvas = document.getElementById("glitchCanvas");
      const ctx = canvas.getContext("2d");
      const palette = ["#4d555e", "#6f7880", "#9a9186", "#c5cbd0"];
      const chars = "GUANGTOUOBSIDIANNOTEFLOWWIKI0123456789[]{}<>+=/#$";
      const fontSize = 16;
      const cellWidth = 10;
      const cellHeight = 20;
      const frameMs = 54;
      const fadeStep = 0.05;
      let cells = [];
      let columns = 0;
      let rows = 0;
      let lastFrame = Date.now();
      let animationFrame = 0;

      function randomChar() {
        return chars[Math.floor(Math.random() * chars.length)];
      }

      function randomColor() {
        return palette[Math.floor(Math.random() * palette.length)];
      }

      function hexToRgb(hex) {
        const expanded = hex.replace(
          /^#?([\da-f])([\da-f])([\da-f])$/i,
          (_, r, g, b) => r + r + g + g + b + b
        );
        const match = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(expanded);
        return match
          ? {
              r: Number.parseInt(match[1], 16),
              g: Number.parseInt(match[2], 16),
              b: Number.parseInt(match[3], 16),
            }
          : null;
      }

      function mixColor(from, to, progress) {
        return `rgb(${Math.round(from.r + (to.r - from.r) * progress)},${Math.round(
          from.g + (to.g - from.g) * progress
        )},${Math.round(from.b + (to.b - from.b) * progress)})`;
      }

      function seedCells() {
        cells = Array.from({ length: columns * rows }, () => {
          const color = randomColor();
          return {
            char: randomChar(),
            color,
            targetColor: randomColor(),
            progress: 1,
          };
        });
      }

      function draw() {
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        ctx.font = `${fontSize}px monospace`;
        ctx.textBaseline = "top";

        for (let index = 0; index < cells.length; index += 1) {
          const cell = cells[index];
          ctx.fillStyle = cell.color;
          ctx.fillText(
            cell.char,
            (index % columns) * cellWidth,
            Math.floor(index / columns) * cellHeight
          );
        }
      }

      function mutate() {
        const amount = Math.max(1, Math.floor(cells.length * 0.045));
        for (let i = 0; i < amount; i += 1) {
          const index = Math.floor(Math.random() * cells.length);
          cells[index].char = randomChar();
          cells[index].targetColor = randomColor();
          cells[index].progress = 0;
        }
      }

      function fadeColors() {
        let changed = false;

        for (const cell of cells) {
          if (cell.progress >= 1) continue;
          cell.progress = Math.min(1, cell.progress + fadeStep);
          const from = hexToRgb(cell.color);
          const to = hexToRgb(cell.targetColor);
          if (from && to) {
            cell.color = mixColor(from, to, cell.progress);
            changed = true;
          }
        }

        if (changed) draw();
      }

      function resize() {
        const parent = canvas.parentElement;
        const rect = parent.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = rect.width * ratio;
        canvas.height = rect.height * ratio;
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        columns = Math.ceil(rect.width / cellWidth);
        rows = Math.ceil(rect.height / cellHeight);
        seedCells();
        draw();
      }

      function loop() {
        const now = Date.now();
        if (now - lastFrame >= frameMs) {
          mutate();
          draw();
          lastFrame = now;
        }
        fadeColors();
        animationFrame = requestAnimationFrame(loop);
      }

      resize();

      if (!reducedMotion) {
        loop();
      }

      let resizeTimer = 0;
      const observer = new ResizeObserver(() => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          cancelAnimationFrame(animationFrame);
          resize();
          if (!reducedMotion) loop();
        }, 100);
      });

      observer.observe(canvas.parentElement);
    }

    function initCursor() {
      const hero = document.getElementById("hero");
      const cursor = document.getElementById("cursorRing");
      const link = document.querySelector(".logo-link");
      const interactiveSelector = "a, button, input, select, textarea";
      let targetX = 0;
      let targetY = 0;
      let currentX = -200;
      let currentY = -200;

      function updateInteractiveState(event) {
        const element = document.elementFromPoint(event.clientX, event.clientY);
        const onLogoLink = Boolean(element && element.closest(".logo-link"));
        const onOtherInteractive = Boolean(
          element
            && element.closest(interactiveSelector)
            && !onLogoLink
        );
        cursor.classList.toggle("is-on-logo", onLogoLink);
        cursor.classList.toggle("is-hidden", onOtherInteractive);
      }

      function move() {
        const linkRect = link.getBoundingClientRect();
        const cursorRect = cursor.getBoundingClientRect();
        const ax = linkRect.left + linkRect.width / 2;
        const ay = linkRect.top + linkRect.height / 2;
        const ar = linkRect.width / 2;

        currentX += (targetX - currentX) * 0.18;
        currentY += (targetY - currentY) * 0.18;

        cursor.style.left = `${currentX}px`;
        cursor.style.top = `${currentY}px`;
        cursor.style.setProperty("--avatar-x", `${ax - currentX + cursorRect.width / 2}px`);
        cursor.style.setProperty("--avatar-y", `${ay - currentY + cursorRect.height / 2}px`);
        cursor.style.setProperty("--avatar-r", `${ar}px`);

        requestAnimationFrame(move);
      }

      hero.addEventListener("mouseenter", () => {
        cursor.style.opacity = "1";
        hero.style.cursor = "none";
      });

      hero.addEventListener("mouseleave", () => {
        cursor.style.opacity = "0";
        hero.style.cursor = "";
      });

      hero.addEventListener("mousemove", (event) => {
        targetX = event.clientX;
        targetY = event.clientY;
        updateInteractiveState(event);
      });

      document.addEventListener("mousemove", (event) => {
        updateInteractiveState(event);
      });

      document.addEventListener("mouseleave", () => {
        cursor.classList.remove("is-hidden");
      });

      move();
    }

    function initLogoTilt() {
      const link = document.querySelector(".logo-link");
      const logo = document.querySelector(".logo");
      const hero = document.getElementById("hero");
      const cursorRingRadius = 100;
      const interactiveSelector = "a, button, input, select, textarea";

      function update(event) {
        const rect = link.getBoundingClientRect();
        const localX = event.clientX - rect.left;
        const localY = event.clientY - rect.top;

        logo.style.setProperty("--reveal-x", `${localX}px`);
        logo.style.setProperty("--reveal-y", `${localY}px`);

        const under = document.elementFromPoint(event.clientX, event.clientY);
        const onLogo = Boolean(under && under.closest(".logo-link"));
        const onOtherInteractive = Boolean(
          under
            && under.closest(interactiveSelector)
            && !under.closest(".logo-link")
        );

        const heroRect = hero.getBoundingClientRect();
        const inHero =
          event.clientX >= heroRect.left && event.clientX <= heroRect.right &&
          event.clientY >= heroRect.top && event.clientY <= heroRect.bottom;

        logo.classList.toggle("is-inverted", onLogo);
        let revealSize;
        if (onLogo) {
          revealSize = 40;
        } else if (onOtherInteractive || !inHero) {
          revealSize = 1;
        } else {
          revealSize = cursorRingRadius;
        }
        logo.style.setProperty("--reveal-size", `${revealSize}px`);

        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const distFromCenter = Math.hypot(localX - cx, localY - cy);
        if (distFromCenter <= rect.width / 2) {
          const tiltX = localX / rect.width - 0.5;
          const tiltY = localY / rect.height - 0.5;
          logo.style.transform =
            `translateZ(32px) scale(1.06) rotateX(${-tiltY * 12}deg) rotateY(${tiltX * 12}deg)`;
        } else {
          logo.style.transform = "translateZ(32px)";
        }
      }

      document.addEventListener("mousemove", update);
      document.addEventListener("mouseleave", () => {
        logo.style.setProperty("--reveal-size", "1px");
        logo.style.transform = "translateZ(32px)";
      });
    }

    typeTitle();
    initGlitchCanvas();
    initCursor();
    initLogoTilt();
  </script>
</body>
